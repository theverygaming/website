---
title: FIR filter calculator
layout: page
nonav: True
---

<script src="/assets/firfilter/firfilter.js" type="module"></script>

<div class="center">
    <div>
        <p><b>System Parameters</b></p>
        <label for="samplerate">Sampling rate</label>
        <input type="number" id="samplerate" onchange="filtercalc.onchange_system_parameters()" value="48000" min="0">
        <br>
    </div>

    <div>
        <p><b>FIR parameters</b></p>
        <label for="fir_window">Window</label>
        <select id="fir_window" onchange="filtercalc.onchange_fircalc()">
            <option value="rectangular">Rectangular</option>
            <option value="blackman">Blackman</option>
            <option value="hann">Hann</option>
            <option value="hamming">Hamming</option>
            <!-- TODO: kaiser window -->
        </select>
        <br>
        <label for="fir_n_taps">Number of taps</label>
        <input type="number" id="fir_n_taps" onchange="filtercalc.onchange_fircalc()" value="63" min="0" step="1">
        <br>
    </div>

    <div>
        <p><b>Filter parameters</b></p>
        <label for="filter_type">Filter Type</label>
        <select id="filter_type" onchange="filtercalc.onchange_fircalc()">
            <option selected="selected" value="lowpass">Lowpass</option>
            <option value="highpass">Highpass</option>
            <option value="bandpass">Bandpass</option>
            <option value="bandstop">Bandstop</option>
        </select>
        <br>
        <label for="filter_f1">f1</label>
        <input type="number" id="filter_f1" onchange="filtercalc.onchange_fircalc()" value="10000" min="0" step="1">
        <br>
        <label for="filter_f2" id="lbl_filter_f2">f2</label>
        <input type="number" id="filter_f2" onchange="filtercalc.onchange_fircalc()" value="12000" min="0" step="1">
        <br id="br_filter_f2">
        <label for="filter_f0db">0dB gain frequency</label>
        <input type="number" id="filter_f0db" onchange="filtercalc.onchange_fircalc()" value="5000" min="0" step="1">
        <br>
    </div>

    <div>
        <p><b>FIR Taps</b></p>
        <label for="fir_taps">FIR Taps (JSON)</label>
        <input type="text" id="fir_taps" onchange="filtercalc.onchange_fir()" value="[0, 1, 1, 0]">
        <br>
    </div>

    <div>
        <p><b>Result</b></p>
        <canvas id="frequency_response"></canvas>
        <canvas id="impulse_response"></canvas>
    </div>
</div>
